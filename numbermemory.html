<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Memory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="numberGameArea">
        <img id="numberMemoryLogo" src="numbermemory.png.png" alt="Number Memory">
        <h1 id="numberGameTitle">Number Memory</h1>
        <p id="numberInstruction">
            An average person remembers 7 numbers at once. Can you do more?
        </p>
        <button id="startButton">Start</button>
        <p id="level"></p>
        <div id="numberDisplay"></div>
        <div id="timerLine"></div>
        <p id="question"></p>
        <input id="numberInput" type="text">
        <p id="result"></p>
        <button id="tryAgainButton">Try Again</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
