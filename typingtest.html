<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Test</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="typingGameArea">
      <img id="typingLogo" src="typingtest.png.png" alt="Typing Test" />
      <h1 id="typingGameTitle">Typing Test</h1>
      <p id="typingInstruction">Type to check your typing speed</p>
      <p id="typingMessage">Click anywhere to start</p>
      <p id="typingTimer">Time: 0.0 s</p>
      <div id="typingText"></div>
      <div id="typingResult">
        <h2>Test Complete!</h2>
        <p id="typingWpm"></p>
        <p id="typingAccuracy"></p>
        <p id="typingTime"></p>
        <p id="typingRestart">Click anywhere to try again</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
